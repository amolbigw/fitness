// ─── Storage ─────────────────────────────────────────────────────────────────
const store = {
  get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
  del: k => localStorage.removeItem(k),
};
// Profile-scoped storage
const pStore = {
  get: (pid, k) => store.get(`fitlog_${pid}_${k}`),
  set: (pid, k, v) => store.set(`fitlog_${pid}_${k}`, v),
  del: (pid, k) => store.del(`fitlog_${pid}_${k}`),
};

// ─── Helpers ─────────────────────────────────────────────────────────────────
function setsReps(day, weekNum) {
  const B = day && day.B;
  if (!B || B.type !== "main" || !B.weekly) return null;
  return B.weekly[Math.min(weekNum - 1, B.weekly.length - 1)];
}

// Parse "Exercise Name (3 x 10-12)" → {name, sr}
function parseEx(str) {
  if (!str) return { name: "", sr: null };
  const m = str.match(/^(.+?)\s*\(([^)]+)\)\s*$/);
  if (m) return { name: m[1].replace(/\s*[—–]\s*Select a Lift\s*/i, "").trim(), sr: m[2].trim() };
  return { name: str.replace(/\s*[—–]\s*Select a Lift\s*/i, "").trim(), sr: null };
}

function advanceDay(cycleIdx, weekNum, dayIdx, completedDays) {
  const nextDayIdx = dayIdx + 1;
  if (nextDayIdx < DAY_ORDER.length) {
    return { cycleIdx, weekNum, dayIdx: nextDayIdx };
  }
  const cycle = PROGRAM[cycleIdx];
  const nextWeek = weekNum + 1;
  if (nextWeek <= cycle.weeks) {
    return { cycleIdx, weekNum: nextWeek, dayIdx: 0 };
  }
  const nextCycle = (cycleIdx + 1) % PROGRAM.length;
  return { cycleIdx: nextCycle, weekNum: 1, dayIdx: 0 };
}

// Beginner-intermediate starting weights for 160 lbs, 5'10" (~23 BMI) lifter
function getStartingWeight(name) {
  const n = name.toLowerCase();
  if (n.includes("back squat") || (n.includes("squat variation"))) return { weight: 115, tip: "~0.7× bodyweight" };
  if (n.includes("front squat") || n.includes("hack squat")) return { weight: 95, tip: "~0.6× bodyweight" };
  if (n.includes("bulgarian") || (n.includes("split squat") && !n.includes("goblet"))) return { weight: 25, tip: "25 lbs per dumbbell" };
  if (n.includes("goblet")) return { weight: 35, tip: "kettlebell or dumbbell" };
  if (n.includes("squat") && !n.includes("cossack") && !n.includes("lateral")) return { weight: 115, tip: "~0.7× bodyweight" };
  if ((n.includes("conventional deadlift")) || (n.includes("deadlift variation") && !n.includes("romanian") && !n.includes("stiff"))) return { weight: 135, tip: "~0.85× bodyweight" };
  if (n.includes("romanian") || n.includes("rdl") || n.includes("stiff-leg") || n.includes("stiff leg")) return { weight: 95, tip: "~0.6× bodyweight" };
  if (n.includes("trap bar")) return { weight: 155, tip: "slightly more than conventional" };
  if (n.includes("deadlift")) return { weight: 135, tip: "~0.85× bodyweight" };
  if (n.includes("leg press")) return { weight: 180, tip: "~1.1× bodyweight" };
  if (n.includes("leg extension")) return { weight: 60, tip: "machine weight" };
  if (n.includes("leg curl") || n.includes("hamstring curl")) return { weight: 50, tip: "machine weight" };
  if (n.includes("calf raise")) return { weight: 90, tip: "machine or barbell" };
  if (n.includes("hip thrust")) return { weight: 95, tip: "barbell" };
  if (n.includes("lunge")) return { weight: 20, tip: "20 lbs per dumbbell" };
  if (n.includes("close grip bench") || n.includes("close-grip bench")) return { weight: 85, tip: "slightly less than bench" };
  if (n.includes("incline") && (n.includes("bench") || n.includes("press"))) return { weight: 75, tip: "~0.47× bodyweight" };
  if (n.includes("dumbbell bench") || (n.includes("db") && n.includes("bench"))) return { weight: 40, tip: "40 lbs per dumbbell" };
  if (n.includes("bench press") || n.includes("bench variation")) return { weight: 95, tip: "~0.6× bodyweight" };
  if (n.includes("overhead press") || n.includes("ohp") || (n.includes("press variation") && !n.includes("bench"))) return { weight: 65, tip: "~0.4× bodyweight" };
  if (n.includes("seated db ohp") || n.includes("dumbbell ohp") || n.includes("shoulder press")) return { weight: 30, tip: "30 lbs per dumbbell" };
  if (n.includes("arnold press")) return { weight: 25, tip: "25 lbs per dumbbell" };
  if (n.includes("chest fly") || n.includes("cable fly") || n.includes("cable chest")) return { weight: 25, tip: "25 lbs per cable" };
  if (n.includes("dip")) return { weight: 0, tip: "bodyweight (160 lbs)" };
  if (n.includes("push-up") || n.includes("pushup")) return { weight: 0, tip: "bodyweight" };
  if (n.includes("skullcrusher")) return { weight: 40, tip: "EZ bar" };
  if (n.includes("tricep") && n.includes("pushdown")) return { weight: 40, tip: "cable stack" };
  if (n.includes("tricep") || n.includes("triceps")) return { weight: 35, tip: "cable or dumbbell" };
  if (n.includes("pull-up") || n.includes("pullup") || n.includes("chin-up")) return { weight: 0, tip: "bodyweight (160 lbs)" };
  if (n.includes("lat pull") || n.includes("lat pulldown")) return { weight: 90, tip: "cable stack" };
  if (n.includes("cable lat")) return { weight: 90, tip: "cable stack" };
  if (n.includes("barbell row") || n.includes("pendlay")) return { weight: 95, tip: "~0.6× bodyweight" };
  if (n.includes("chest supported row")) return { weight: 45, tip: "45 lbs per dumbbell" };
  if (n.includes("1-arm") && n.includes("row")) return { weight: 45, tip: "45 lbs dumbbell" };
  if (n.includes("cable row") || n.includes("seated row")) return { weight: 70, tip: "cable stack" };
  if (n.includes("face pull")) return { weight: 30, tip: "cable stack" };
  if (n.includes("rear delt")) return { weight: 12, tip: "12 lbs per dumbbell" };
  if (n.includes("lateral raise")) return { weight: 15, tip: "15 lbs per dumbbell" };
  if (n.includes("upright row")) return { weight: 45, tip: "barbell or cable" };
  if (n.includes("incline") && n.includes("curl")) return { weight: 20, tip: "20 lbs per dumbbell" };
  if (n.includes("preacher curl")) return { weight: 45, tip: "EZ bar" };
  if (n.includes("cable curl")) return { weight: 40, tip: "cable stack" };
  if (n.includes("hammer curl")) return { weight: 30, tip: "30 lbs per dumbbell" };
  if (n.includes("curl")) return { weight: 25, tip: "25 lbs per dumbbell" };
  if (n.includes("row")) return { weight: 70, tip: "adjust to feel" };
  return { weight: 45, tip: "adjust based on feel" };
}

function allLogs(pid) { return pStore.get(pid, "logs") || {}; }

function getLastLog(exerciseName, pid) {
  const entries = allLogs(pid)[exerciseName];
  return entries && entries.length > 0 ? entries[entries.length - 1] : null;
}

function saveLog(exerciseName, sets, cycleLabel, weekNum, pid) {
  const logs = allLogs(pid);
  if (!logs[exerciseName]) logs[exerciseName] = [];
  logs[exerciseName].push({
    date: new Date().toISOString().split("T")[0],
    cycleLabel, weekNum, sets,
  });
  pStore.set(pid, "logs", logs);
}

function getSuggested(exerciseName, lastLog) {
  if (!lastLog || !lastLog.sets || lastLog.sets.length === 0)
    return { ...getStartingWeight(exerciseName), isDefault: true };
  const validSets = lastLog.sets.filter(s => parseFloat(s.weight) > 0 || parseInt(s.reps) > 0);
  if (validSets.length === 0) return { ...getStartingWeight(exerciseName), isDefault: true };
  const avgWeight = validSets.reduce((s, x) => s + (parseFloat(x.weight) || 0), 0) / validSets.length;
  const avgReps   = validSets.reduce((s, x) => s + (parseInt(x.reps)   || 0), 0) / validSets.length;
  const n = exerciseName.toLowerCase();
  const isLower = n.includes("squat") || n.includes("deadlift") || n.includes("leg") || n.includes("hip") || n.includes("lunge");
  const inc = isLower ? 10 : 5;
  const suggested = avgReps >= 8 ? avgWeight + inc : avgReps >= 6 ? avgWeight : Math.max(0, avgWeight - inc);
  return {
    weight: Math.round(suggested / 2.5) * 2.5,
    tip: avgReps >= 8 ? `+${inc} lbs — hit top of range` : avgReps >= 6 ? "same weight — stay here" : `-${inc} lbs — reset slightly`,
    isDefault: false,
  };
}

function parseSetsCount(str) {
  if (!str) return 3;
  const m = str.match(/^(\d+)/);
  return m ? Math.min(parseInt(m[1]), 6) : 3;
}

function daysAgoStr(isoDate) {
  try {
    const diff = Math.round((Date.now() - new Date(isoDate)) / 86400000);
    if (diff === 0) return "today";
    if (diff === 1) return "yesterday";
    return `${diff}d ago`;
  } catch { return isoDate; }
}

function ExerciseLogger({ exerciseName, setsRepsStr, color, cycleLabel, weekNum, profileId }) {
  const lastLog  = getLastLog(exerciseName, profileId);
  const suggestion = getSuggested(exerciseName, lastLog);
  const n = parseSetsCount(setsRepsStr);
  const [sets, setSets] = useState(() =>
    Array.from({ length: n }, () => ({ weight: suggestion.weight > 0 ? String(suggestion.weight) : "", reps: "" }))
  );
  const [saved, setSaved] = useState(false);

  function update(i, field, val) { setSets(p => p.map((s, idx) => idx === i ? { ...s, [field]: val } : s)); setSaved(false); }

  function handleSave() {
    const filled = sets.filter(s => s.weight !== "" || s.reps !== "");
    if (filled.length === 0) return;
    saveLog(exerciseName, filled, cycleLabel, weekNum, profileId);
    setSaved(true);
  }

  const inputStyle = (c) => ({
    flex: 1, minWidth: 0, padding: "8px 4px", borderRadius: 5,
    border: `1px solid ${c}44`, background: "#060F1E",
    color: "#E8F0FE", fontSize: 14, fontWeight: 700,
    fontFamily: "inherit", textAlign: "center",
    boxSizing: "border-box",
  });

  return (
    <div style={{ padding: "14px 16px 16px", background: color + "0A", borderBottom: `1px solid ${color}1A` }}>
      {/* Suggestion + last time cards */}
      <div style={{ display: "flex", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
        <div style={{ flex: 1, minWidth: "140px", background: color + "1C", borderRadius: 6, padding: "10px 12px", border: `1px solid ${color}33` }}>
          <div style={{ fontSize: 9, fontWeight: 700, color, letterSpacing: "0.1em", marginBottom: 4 }}>
            {suggestion.isDefault ? "SUGGESTED START" : "SUGGESTED"}
          </div>
          <div style={{ fontSize: 20, fontWeight: 900, color: "#E8F0FE", letterSpacing: "-0.02em" }}>
            {suggestion.weight > 0 ? `${suggestion.weight} lbs` : "Bodyweight"}
          </div>
          <div style={{ fontSize: 10, color: "#7AAAE8", marginTop: 3, lineHeight: 1.4 }}>{suggestion.tip}</div>
        </div>
        <div style={{ flex: 1, minWidth: "140px", background: "#0A1525", borderRadius: 6, padding: "10px 12px", border: "1px solid #1A3050" }}>
          <div style={{ fontSize: 9, fontWeight: 700, color: "#7AAAE8", letterSpacing: "0.1em", marginBottom: 4 }}>
            {lastLog ? `LAST TIME · ${daysAgoStr(lastLog.date)}` : "LAST TIME"}
          </div>
          {lastLog ? (
            <>
              <div style={{ fontSize: 11, color: "#9DBDE8", lineHeight: 1.7 }}>
                {lastLog.sets.map((s, i) => <span key={i}>{i > 0 ? " · " : ""}{parseFloat(s.weight) > 0 ? `${s.weight}lb` : "BW"}×{s.reps}</span>)}
              </div>
              <div style={{ fontSize: 10, color: "#5B8BD4", marginTop: 3 }}>{lastLog.cycleLabel} · Wk {lastLog.weekNum}</div>
            </>
          ) : (
            <>
              <div style={{ fontSize: 11, color: "#3D5A7A" }}>No history yet</div>
              <div style={{ fontSize: 10, color: "#3D5A7A", marginTop: 3 }}>160 lbs · 5'10" profile</div>
            </>
          )}
        </div>
      </div>

      {/* Set inputs */}
      <div style={{ marginBottom: 12 }}>
        {sets.map((s, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8, width: "100%" }}>
            <span style={{ fontSize: 10, color: "#5B8BD4", fontWeight: 700, width: 24, flexShrink: 0, letterSpacing: "0.02em" }}>
              S{i + 1}
            </span>
            <input type="number" placeholder="lbs" value={s.weight} onChange={e => update(i, "weight", e.target.value)} style={inputStyle(color)} />
            <span style={{ fontSize: 12, color: "#5B8BD4", flexShrink: 0, fontWeight: 600, width: 12, textAlign: "center" }}>×</span>
            <input type="number" placeholder="reps" value={s.reps} onChange={e => update(i, "reps", e.target.value)} style={inputStyle(color)} />
          </div>
        ))}
      </div>

      <button onClick={handleSave} style={{
        background: saved ? "#16A34A22" : color,
        color: saved ? "#22C55E" : "#fff",
        border: saved ? "1px solid #22C55E55" : "none",
        padding: "8px 20px", borderRadius: 5, fontSize: 11, fontWeight: 700,
        letterSpacing: "0.06em", cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s"
      }}>
        {saved ? "✓ Saved" : "Save Sets"}
      </button>
    </div>
  );
}

        </button>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
          <CycleTag cycle={cycle} />
          <span style={{ fontSize: 9, fontWeight: 700, padding: "2px 7px", borderRadius: 2, background: color + "22", color, letterSpacing: "0.1em" }}>
            {DAY_LABEL[dayKey]}
          </span>
          <span style={{ fontSize: 10, color: "#7AAAE8", fontWeight: 600 }}>WK {weekNum}</span>
        </div>
        <div style={{ fontWeight: 800, fontSize: 22, color: "#E8F0FE", letterSpacing: "-0.02em", lineHeight: 1.2, marginBottom: 20 }}>
          {day.focus}
        </div>
      </div>

      <div style={{ paddingBottom: 110 }}>

        {/* ── Helper: render a tappable exercise row with optional ExerciseLogger ── */}
        {(() => {
          function ExRow({ ex, sectionKey, i }) {
            const key = `${sectionKey}-${i}`;
            const isOpen = expandedEx === key;
            const { name, sr: exSr } = parseEx(ex);
            return (
              <div key={key}>
                <div className="tappable" onClick={() => toggleEx(key)}
                  style={{ padding: "12px 20px", borderBottom: isOpen ? "none" : "1px solid #1A2D45",
                    display: "flex", alignItems: "center", justifyContent: "space-between",
                    background: isOpen ? color + "08" : "transparent" }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 13, color: "#C8D8F8", fontWeight: 600 }}>{name}</div>
                    {exSr && <div style={{ fontSize: 11, color, fontWeight: 700, marginTop: 2 }}>{exSr}</div>}
                  </div>
                  <span style={{ color: "#5B8BD4", fontSize: 11, marginLeft: 12, flexShrink: 0 }}>{isOpen ? "▲" : "▼"}</span>
                </div>
                {isOpen && <ExerciseLogger exerciseName={name} setsRepsStr={exSr} color={color} cycleLabel={cycle.label} weekNum={weekNum} profileId={profileId} />}
              </div>
            );
          }

          const sections = [
            { key: "A", label: "A — Warm-Up / Activation", items: day.A || [], type: "list" },
            { key: "B", label: "B — Main Lift", bData: day.B },
            { key: "C", label: "C — Accessories", items: day.C || [], type: "list" },
          ];

          return sections.map(sec => {
            if (sec.key === "B") {
              const B = sec.bData;
              if (!B) return null;
              if (B.type === "main") {
                const { name } = parseEx(B.exercise);
                return (
                  <div key="B">
                    <SectionLabel>{sec.label}</SectionLabel>
                    <div style={{ margin: "0 20px 2px", padding: "14px 16px 14px", borderRadius: 8, background: color + "12", border: `1px solid ${color}30` }}>
                      <div style={{ fontWeight: 700, fontSize: 15, color: "#C8D8F8", marginBottom: 4, letterSpacing: "-0.01em" }}>
                        {name}
                      </div>
                      {sr && (
                        <div style={{ fontWeight: 900, fontSize: 24, color, letterSpacing: "-0.02em" }}>{sr}</div>
                      )}
                      {!sr && B.exercise && (
                        <div style={{ fontSize: 12, color: "#7AAAE8", fontWeight: 500, marginTop: 2 }}>
                          {B.exercise.replace(name, "").replace(/^\s*[—–(]\s*/, "").replace(/\)\s*$/, "").trim() || "See progression"}
                        </div>
                      )}
                    </div>
                    <ExerciseLogger exerciseName={name} setsRepsStr={sr} color={color} cycleLabel={cycle.label} weekNum={weekNum} profileId={profileId} />
                  </div>
                );
              } else {
                // B is a list of exercises
                const items = B.items || [];
                if (!items.length) return null;
                return (
                  <div key="B">
                    <SectionLabel>{sec.label}</SectionLabel>
                    {items.map((ex, i) => <ExRow key={i} ex={ex} sectionKey="B" i={i} />)}
                  </div>
                );
              }
            }
            // Section A or C
            if (!sec.items.length) return null;
            return (
              <div key={sec.key}>
                <SectionLabel>{sec.label}</SectionLabel>
                {sec.items.map((ex, i) => <ExRow key={i} ex={ex} sectionKey={sec.key} i={i} />)}
              </div>
            );
          });
        })()}

        {/* Optional finisher */}
        {day.finisher && (
          <div style={{ margin: "16px 20px 0", padding: "12px 14px", borderRadius: 6, background: "#0D1A2E", border: "1px solid #1A3050" }}>
            <div style={{ fontSize: 9, color: "#7AAAE8", fontWeight: 700, letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: 6 }}>
              Optional Finisher
            </div>
            <div style={{ fontSize: 12, color: "#9DBDE8", fontWeight: 500, lineHeight: 1.5 }}>{day.finisher}</div>
          </div>
        )}
      </div>

      {/* Fixed CTA */}
      <div style={{
        position: "fixed", bottom: 0, left: 0, right: 0,
        padding: "14px 20px 24px",
        background: "linear-gradient(to top, #060912 60%, transparent)",
        maxWidth: 600, margin: "0 auto"
      }}>
        <button className="btn" onClick={markComplete} style={{
          width: "100%", background: color, color: "#fff",
          fontWeight: 700, fontSize: 13, letterSpacing: "0.04em",
          padding: "13px 20px", borderRadius: 6
        }}>
          Mark Complete — Advance →
        </button>
      </div>
    </div>
  );
}

function ProgramView({ state, setState, setView, setSelectedDay, profileId }) {
  return (
    <div style={{ padding: "24px 20px", maxWidth: 600, margin: "0 auto" }}>
      <div style={{ fontWeight: 800, fontSize: 20, color: "#E8F0FE", letterSpacing: "-0.02em", marginBottom: 4 }}>
        Full Program
      </div>
      <div style={{ fontSize: 10, color: "#1E3A6E", fontWeight: 600, letterSpacing: "0.1em", marginBottom: 24, textTransform: "uppercase" }}>
        18 Cycles · 4 Days/Week · Mon / Tue / Thu / Fri
      </div>

      {PROGRAM.map((cycle, ci) => {
        const active = ci === state.cycleIdx;
        return (
          <div key={ci} style={{
            border: active ? "1px solid #2563EB55" : "1px solid #1A2D45",
            borderLeft: active ? "3px solid #2563EB" : "3px solid #1A2D45",
            borderRadius: 6, marginBottom: 10, overflow: "hidden",
            background: active ? "#0D1A2E" : "#0A1525"
          }}>
            {/* Cycle header */}
            <div style={{ padding: "14px 16px 10px", display: "flex", alignItems: "flex-start", justifyContent: "space-between" }}>
              <div>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                  <CycleTag cycle={cycle} />
                  <span style={{ fontSize: 10, color: "#6B9ED8", fontWeight: 500 }}>{cycle.dates}</span>
                  {active && <span style={{ fontSize: 9, color: "#2563EB", fontWeight: 700 }}>← CURRENT</span>}
                </div>
                <div style={{ fontWeight: 700, fontSize: 14, color: active ? "#C8D8F8" : "#8BAAD6", letterSpacing: "-0.01em" }}>
                  {cycle.name}
                </div>
                <div style={{ fontSize: 11, color: "#6B9ED8", marginTop: 4, lineHeight: 1.4 }}>{cycle.scheme}</div>
              </div>
              <div style={{ fontSize: 10, color: "#6B9ED8", fontWeight: 600, whiteSpace: "nowrap", marginLeft: 12 }}>
                {cycle.weeks}w
              </div>
            </div>

            {/* Days grid */}
            <div style={{ borderTop: "1px solid #1A2D45", display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr" }}>
              {DAY_ORDER.map(dayKey => {
                const day = cycle.days[dayKey];
                const color = DAY_COLOR[dayKey];
                const isActiveDay = active && DAY_ORDER.indexOf(dayKey) === state.dayIdx;
                return (
                  <div key={dayKey} className="tappable" onClick={() => {
                    const ns = { cycleIdx: ci, weekNum: active ? state.weekNum : 1, dayIdx: DAY_ORDER.indexOf(dayKey) };
                    setState(ns);
                    pStore.set(profileId, "state", ns);
                    setSelectedDay(dayKey);
                    setView("workout");
                  }} style={{
                    padding: "10px 10px",
                    borderRight: dayKey !== "friday" ? "1px solid #0A1020" : "none",
                    background: isActiveDay ? color + "18" : "transparent"
                  }}>
                    <div style={{ fontSize: 9, fontWeight: 700, color: isActiveDay ? color : "#6B9ED8", letterSpacing: "0.08em", marginBottom: 3 }}>
                      {DAY_LABEL[dayKey]}
                    </div>
                    <div style={{ fontSize: 10, color: "#8BAAD6", fontWeight: 500, lineHeight: 1.3 }}>
                      {day.focus.split(" — ")[1] || day.focus}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── App ─────────────────────────────────────────────────────────────────────
function App() {
  const defaultState = { cycleIdx: 17, weekNum: 1, dayIdx: 0 }; // Cycle 8 (Feb–Mar 2026, current)
  const [activeProfile, setActiveProfileState] = useState(() => store.get("fitlog_active_profile") || "AW");
  const [state, setState] = useState(null);
  const [view, setView] = useState("home");
  const [selectedDay, setSelectedDay] = useState(null);

  // Load workout state whenever the active profile changes
  useEffect(() => {
    const saved = pStore.get(activeProfile, "state");
    setState(saved || defaultState);
  }, [activeProfile]);

  function setActiveProfile(pid) {
    store.set("fitlog_active_profile", pid);
    setActiveProfileState(pid);
    setView("home");
    setSelectedDay(null);
    // state will reload via the useEffect above
    setState(null);
  }

  if (!state) return (
    <div style={{
      height: "100vh", display: "flex", alignItems: "center", justifyContent: "center",
      background: "#060912", color: "#1E3A6E", fontSize: 13, fontWeight: 500,
      fontFamily: "Inter, Helvetica Neue, sans-serif"
    }}>
      Loading...
    </div>
  );

  return (
    <div style={{ minHeight: "100vh", background: "#060912", color: "#E8F0FE", overflowX: "hidden" }}>
      <Header view={view} setView={setView} activeProfile={activeProfile} setActiveProfile={setActiveProfile} />
      {view === "home" && (
        <HomeView state={state} setState={setState} setView={setView} setSelectedDay={setSelectedDay} profileId={activeProfile} />
      )}
      {view === "workout" && (
        <WorkoutView state={state} setState={setState} setView={setView} selectedDay={selectedDay} profileId={activeProfile} />
      )}
      {view === "program" && (
        <ProgramView state={state} setState={setState} setView={setView} setSelectedDay={setSelectedDay} profileId={activeProfile} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
