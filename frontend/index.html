// ─── Storage ─────────────────────────────────────────────────────────────────
const store = {
  get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
  del: k => localStorage.removeItem(k),
};

// ─── Helpers ─────────────────────────────────────────────────────────────────
function setsReps(day, weekNum) {
  if (!day.mainLift) return null;
  const arr = day.mainLift.weekly;
  return arr[Math.min(weekNum - 1, arr.length - 1)] || arr[arr.length - 1];
}

function advanceDay(cycleIdx, weekNum, dayIdx, completedDays) {
  const nextDayIdx = dayIdx + 1;
  if (nextDayIdx < DAY_ORDER.length) {
    return { cycleIdx, weekNum, dayIdx: nextDayIdx };
  }
  const cycle = PROGRAM[cycleIdx];
  const nextWeek = weekNum + 1;
  if (nextWeek <= cycle.weeks) {
    return { cycleIdx, weekNum: nextWeek, dayIdx: 0 };
  }
  const nextCycle = (cycleIdx + 1) % PROGRAM.length;
  return { cycleIdx: nextCycle, weekNum: 1, dayIdx: 0 };
}

            padding: "6px 14px", fontSize: 11, fontWeight: 600,
            letterSpacing: "0.06em", textTransform: "uppercase",
            color: view === t ? "#3B82F6" : "#1E3A6E",
            borderBottom: view === t ? "2px solid #3B82F6" : "2px solid transparent",
          }}>
            {t}
          </button>
        ))}
      </div>
    </div>
  );
}

function CycleTag({ cycle }) {
  return (
    <span style={{
      fontSize: 10, fontWeight: 700, padding: "2px 8px", borderRadius: 3,
      background: "#2563EB22", color: "#3B82F6",
      letterSpacing: "0.08em", textTransform: "uppercase"
    }}>
      {cycle.label}
    </span>
  );
}

function HomeView({ state, setState, setView, setSelectedDay }) {
  const { cycleIdx, weekNum, dayIdx } = state;
  const cycle = PROGRAM[cycleIdx];

  function selectDay(d) {
    setSelectedDay(d);
    setView("workout");
  }

  return (
    <div style={{ padding: "24px 20px", maxWidth: 600, margin: "0 auto" }}>

      {/* Cycle header */}
      <div style={{ marginBottom: 24 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
          <CycleTag cycle={cycle} />
          <span style={{ fontSize: 10, color: "#1E3A6E", fontWeight: 600, letterSpacing: "0.1em" }}>
            WEEK {weekNum} OF {cycle.weeks}
          </span>
        </div>
        <div style={{ fontWeight: 800, fontSize: 20, color: "#E8F0FE", letterSpacing: "-0.02em", lineHeight: 1.2 }}>
          {cycle.name}
        </div>
        <div style={{ fontSize: 11, color: "#1E3A6E", marginTop: 6, lineHeight: 1.5, fontWeight: 400 }}>
          {cycle.scheme}
        </div>
      </div>

      {/* Week progress bar */}
      <div style={{ marginBottom: 24 }}>
        <div style={{ height: 3, background: "#0C1424", borderRadius: 2 }}>
          <div style={{
            height: 3, borderRadius: 2, background: "#2563EB",
            width: `${((weekNum - 1) / cycle.weeks) * 100}%`,
            transition: "width 0.3s ease"
          }} />
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 5 }}>
          {Array.from({ length: cycle.weeks }, (_, i) => (
            <div key={i} style={{
              width: 6, height: 6, borderRadius: "50%",
              background: i < weekNum - 1 ? "#2563EB" : i === weekNum - 1 ? "#3B82F6" : "#0C1424"
            }} />
          ))}
        </div>
      </div>

      {/* This week's 4 days */}
      <div style={{ marginBottom: 10 }}>
        <div style={{ fontSize: 10, color: "#1E3A6E", fontWeight: 600, letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: 12 }}>
          This Week
        </div>
        {DAY_ORDER.map((dayKey, i) => {
          const day = cycle.days[dayKey];
          const color = DAY_COLOR[dayKey];
          const isNext = i === dayIdx;
          const sr = setsReps(day, weekNum);
          return (
            <div key={dayKey} className="day-card" onClick={() => selectDay(dayKey)}
              style={{
                border: isNext ? `1px solid ${color}44` : "1px solid #0C1424",
                borderLeft: `3px solid ${isNext ? color : "#0C1424"}`,
                padding: "14px 16px", marginBottom: 8, borderRadius: 6,
                background: isNext ? "#080D19" : "#070C18",
              }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <div style={{ flex: 1 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 5 }}>
                    <span style={{
                      fontSize: 9, fontWeight: 700, padding: "2px 7px", borderRadius: 2,
                      background: color + "22", color, letterSpacing: "0.1em"
                    }}>
                      {DAY_LABEL[dayKey]}
                    </span>
                    {isNext && (
                      <span style={{ fontSize: 9, color: "#2563EB", fontWeight: 700, letterSpacing: "0.08em" }}>
                        UP NEXT
                      </span>
                    )}
                  </div>
                  <div style={{ fontWeight: 600, fontSize: 14, color: isNext ? "#C8D8F8" : "#243558", letterSpacing: "-0.01em" }}>
                    {day.focus}
                  </div>
                  {day.mainLift && (
                    <div style={{ fontSize: 11, color: "#1A2E50", marginTop: 3 }}>
                      {day.mainLift.name.replace(" (Select a Lift)","").replace(" Variation","").replace(" (Select a Lift)","").replace(/Variation.*$/, "")}
                    </div>
                  )}
                </div>
                {sr && (
                  <div style={{ textAlign: "right", marginLeft: 12 }}>
                    <div style={{ fontWeight: 800, fontSize: 15, color, letterSpacing: "-0.01em" }}>{sr}</div>
                    <div style={{ fontSize: 9, color: "#1A2E50", fontWeight: 500, letterSpacing: "0.06em" }}>THIS WEEK</div>
                  </div>
                )}
                <div style={{ marginLeft: 10, color: "#1A2E50", fontSize: 12 }}>→</div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Navigation controls */}
      <div style={{ borderTop: "1px solid #0C1424", paddingTop: 18, marginTop: 8 }}>
        <div style={{ fontSize: 10, color: "#1A2E50", fontWeight: 600, letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 12 }}>
          Navigate
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button className="btn" onClick={() => {
            const prev = weekNum > 1 ? { ...state, weekNum: weekNum - 1 }
              : cycleIdx > 0 ? { cycleIdx: cycleIdx - 1, weekNum: PROGRAM[cycleIdx-1].weeks, dayIdx: 0 }
              : state;
            setState(prev); store.set("fitlog_state", prev);
          }} style={{
            background: "#0C1424", color: "#3B82F6", fontSize: 11, fontWeight: 600,
            padding: "8px 14px", borderRadius: 5, letterSpacing: "0.04em"
          }}>
            ← Prev Week
          </button>
          <button className="btn" onClick={() => {
            const cycle = PROGRAM[cycleIdx];
            const next = weekNum < cycle.weeks
              ? { ...state, weekNum: weekNum + 1, dayIdx: 0 }
              : cycleIdx < PROGRAM.length - 1
              ? { cycleIdx: cycleIdx + 1, weekNum: 1, dayIdx: 0 }
              : state;
            setState(next); store.set("fitlog_state", next);
          }} style={{
            background: "#0C1424", color: "#3B82F6", fontSize: 11, fontWeight: 600,
            padding: "8px 14px", borderRadius: 5, letterSpacing: "0.04em"
          }}>
            Next Week →
          </button>
          <button className="btn" onClick={() => {
            const s = { cycleIdx: 7, weekNum: 5, dayIdx: 0 };
            setState(s); store.set("fitlog_state", s);
          }} style={{
            background: "#0C1424", color: "#1E3A6E", fontSize: 11, fontWeight: 500,
            padding: "8px 14px", borderRadius: 5, letterSpacing: "0.04em"
          }}>
            Jump to Current
          </button>
        </div>
      </div>
    </div>
  );
}

function WorkoutView({ state, setState, setView, selectedDay }) {
  const { cycleIdx, weekNum, dayIdx } = state;
  const cycle = PROGRAM[cycleIdx];
  const dayKey = selectedDay || DAY_ORDER[dayIdx];
  const day = cycle.days[dayKey];
  const color = DAY_COLOR[dayKey];
  const sr = setsReps(day, weekNum);
  const [expanded, setExpanded] = useState(null);

  function markComplete() {
    const nextDayIdx = DAY_ORDER.indexOf(dayKey) + 1;
    let next;
    if (nextDayIdx < DAY_ORDER.length) {
      next = { ...state, dayIdx: nextDayIdx };
    } else {
      const nextWeek = weekNum + 1;
      if (nextWeek <= cycle.weeks) {
        next = { ...state, weekNum: nextWeek, dayIdx: 0 };
      } else {
        const nc = (cycleIdx + 1) % PROGRAM.length;
        next = { cycleIdx: nc, weekNum: 1, dayIdx: 0 };
      }
    }
    setState(next);
    store.set("fitlog_state", next);
    setView("home");
  }

  return (
    <div style={{ maxWidth: 600, margin: "0 auto" }}>
      <div style={{ padding: "18px 20px 0" }}>
        <button className="tab-btn" onClick={() => setView("home")} style={{
          color: "#1E3A6E", fontSize: 11, letterSpacing: "0.06em",
          marginBottom: 18, display: "block", fontWeight: 600
        }}>
          ← Back
        </button>

        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
          <CycleTag cycle={cycle} />
          <span style={{
            fontSize: 9, fontWeight: 700, padding: "2px 7px", borderRadius: 2,
            background: color + "22", color, letterSpacing: "0.1em"
          }}>
            {DAY_LABEL[dayKey]}
          </span>
          <span style={{ fontSize: 10, color: "#1E3A6E", fontWeight: 600 }}>WK {weekNum}</span>
        </div>
        <div style={{ fontWeight: 800, fontSize: 22, color: "#E8F0FE", letterSpacing: "-0.02em", lineHeight: 1.2, marginBottom: 20 }}>
          {day.focus}
        </div>
      </div>

      <div style={{ paddingBottom: 110 }}>

        {/* Main Lift */}
        {day.mainLift && (
          <div style={{ marginBottom: 2 }}>
            <div style={{
              padding: "12px 20px 8px",
              fontSize: 9, color: "#1E3A6E", fontWeight: 700, letterSpacing: "0.12em", textTransform: "uppercase"
            }}>
              Main Lift
            </div>
            <div style={{
              margin: "0 20px", padding: "16px", borderRadius: 8,
              background: color + "12", border: `1px solid ${color}28`,
              marginBottom: 16
            }}>
              <div style={{ fontWeight: 700, fontSize: 16, color: "#C8D8F8", marginBottom: 4, letterSpacing: "-0.01em" }}>
                {day.mainLift.name}
              </div>
              <div style={{ fontWeight: 900, fontSize: 28, color, letterSpacing: "-0.02em", marginBottom: 10 }}>
                {sr}
              </div>
              {day.mainLift.options && (
                <div>
                  <div style={{ fontSize: 9, color: "#1E3A6E", fontWeight: 700, letterSpacing: "0.1em", marginBottom: 6 }}>
                    OPTIONS
                  </div>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    {day.mainLift.options.map((o, i) => (
                      <span key={i} style={{
                        fontSize: 10, fontWeight: 500, padding: "3px 9px", borderRadius: 3,
                        background: "#0D1424", color: "#243558", border: "1px solid #0F1929"
                      }}>
                        {o}
                      </span>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
        )}

        {/* Activation Circuit */}
        {day.activation && day.activation.length > 0 && (
          <div>
            <div style={{
              padding: "12px 20px 8px",
              fontSize: 9, color: "#1E3A6E", fontWeight: 700, letterSpacing: "0.12em", textTransform: "uppercase"
            }}>
              Activation Circuit
            </div>
            {day.activation.map((ex, i) => (
              <div key={i} className="tappable" style={{
                padding: "13px 20px",
                borderBottom: "1px solid #0A1020",
                background: "transparent"
              }}>
                <div style={{ fontWeight: 500, fontSize: 13, color: "#7090C0", letterSpacing: "-0.01em" }}>
                  {ex}
                </div>
              </div>
            ))}
          </div>
        )}

        {/* Accessories */}
        {day.accessories && day.accessories.length > 0 && (
          <div>
            <div style={{
              padding: "12px 20px 8px",
              fontSize: 9, color: "#1E3A6E", fontWeight: 700, letterSpacing: "0.12em", textTransform: "uppercase"
            }}>
              Accessories
            </div>
            {day.accessories.map((ex, i) => (
              <div key={i} className="tappable" style={{
                padding: "13px 20px",
                borderBottom: "1px solid #0A1020",
                background: "transparent"
              }}>
                <div style={{ fontWeight: 500, fontSize: 13, color: "#7090C0", letterSpacing: "-0.01em" }}>
                  {ex}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Fixed CTA */}
      <div style={{
        position: "fixed", bottom: 0, left: 0, right: 0,
        padding: "14px 20px 24px",
        background: "linear-gradient(to top, #060912 60%, transparent)",
        maxWidth: 600, margin: "0 auto"
      }}>
        <button className="btn" onClick={markComplete} style={{
          width: "100%", background: color, color: "#fff",
          fontWeight: 700, fontSize: 13, letterSpacing: "0.04em",
          padding: "13px 20px", borderRadius: 6
        }}>
          Mark Complete — Advance →
        </button>
      </div>
    </div>
  );
}

function ProgramView({ state, setState, setView, setSelectedDay }) {
  return (
    <div style={{ padding: "24px 20px", maxWidth: 600, margin: "0 auto" }}>
      <div style={{ fontWeight: 800, fontSize: 20, color: "#E8F0FE", letterSpacing: "-0.02em", marginBottom: 4 }}>
        Full Program
      </div>
      <div style={{ fontSize: 10, color: "#1E3A6E", fontWeight: 600, letterSpacing: "0.1em", marginBottom: 24, textTransform: "uppercase" }}>
        8 Cycles · 4 Days/Week · Mon / Tue / Thu / Fri
      </div>

      {PROGRAM.map((cycle, ci) => {
        const active = ci === state.cycleIdx;
        return (
          <div key={ci} style={{
            border: active ? "1px solid #2563EB33" : "1px solid #0C1424",
            borderLeft: active ? "3px solid #2563EB" : "3px solid #0C1424",
            borderRadius: 6, marginBottom: 10, overflow: "hidden",
            background: active ? "#080D19" : "#070C18"
          }}>
            {/* Cycle header */}
            <div style={{ padding: "14px 16px 10px", display: "flex", alignItems: "flex-start", justifyContent: "space-between" }}>
              <div>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                  <CycleTag cycle={cycle} />
                  <span style={{ fontSize: 10, color: "#1A2E50", fontWeight: 500 }}>{cycle.dates}</span>
                  {active && <span style={{ fontSize: 9, color: "#2563EB", fontWeight: 700 }}>← CURRENT</span>}
                </div>
                <div style={{ fontWeight: 700, fontSize: 14, color: active ? "#C8D8F8" : "#243558", letterSpacing: "-0.01em" }}>
                  {cycle.name}
                </div>
                <div style={{ fontSize: 11, color: "#1A2E50", marginTop: 4, lineHeight: 1.4 }}>{cycle.scheme}</div>
              </div>
              <div style={{ fontSize: 10, color: "#1A2E50", fontWeight: 600, whiteSpace: "nowrap", marginLeft: 12 }}>
                {cycle.weeks}w
              </div>
            </div>

            {/* Days grid */}
            <div style={{ borderTop: "1px solid #0C1424", display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr" }}>
              {DAY_ORDER.map(dayKey => {
                const day = cycle.days[dayKey];
                const color = DAY_COLOR[dayKey];
                const isActiveDay = active && DAY_ORDER.indexOf(dayKey) === state.dayIdx;
                return (
                  <div key={dayKey} className="tappable" onClick={() => {
                    setState({ cycleIdx: ci, weekNum: active ? state.weekNum : 1, dayIdx: DAY_ORDER.indexOf(dayKey) });
                    store.set("fitlog_state", { cycleIdx: ci, weekNum: active ? state.weekNum : 1, dayIdx: DAY_ORDER.indexOf(dayKey) });
                    setSelectedDay(dayKey);
                    setView("workout");
                  }} style={{
                    padding: "10px 10px",
                    borderRight: dayKey !== "friday" ? "1px solid #0A1020" : "none",
                    background: isActiveDay ? color + "18" : "transparent"
                  }}>
                    <div style={{ fontSize: 9, fontWeight: 700, color: isActiveDay ? color : "#1A2E50", letterSpacing: "0.08em", marginBottom: 3 }}>
                      {DAY_LABEL[dayKey]}
                    </div>
                    <div style={{ fontSize: 10, color: "#243558", fontWeight: 500, lineHeight: 1.3 }}>
                      {day.focus.split(" — ")[1] || day.focus}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── App ─────────────────────────────────────────────────────────────────────
function App() {
  const defaultState = { cycleIdx: 7, weekNum: 5, dayIdx: 0 }; // Cycle 8, Week 5
  const [state, setState] = useState(null);
  const [view, setView] = useState("home");
  const [selectedDay, setSelectedDay] = useState(null);

  useEffect(() => {
    const saved = store.get("fitlog_state");
    setState(saved || defaultState);
  }, []);

  if (!state) return (
    <div style={{
      height: "100vh", display: "flex", alignItems: "center", justifyContent: "center",
      background: "#060912", color: "#1E3A6E", fontSize: 13, fontWeight: 500,
      fontFamily: "Inter, Helvetica Neue, sans-serif"
    }}>
      Loading...
    </div>
  );

  return (
    <div style={{ minHeight: "100vh", background: "#060912", color: "#E8F0FE", overflowX: "hidden" }}>
      <Header view={view} setView={setView} />
      {view === "home" && (
        <HomeView state={state} setState={setState} setView={setView} setSelectedDay={setSelectedDay} />
      )}
      {view === "workout" && (
        <WorkoutView state={state} setState={setState} setView={setView} selectedDay={selectedDay} />
      )}
      {view === "program" && (
        <ProgramView state={state} setState={setState} setView={setView} setSelectedDay={setSelectedDay} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
